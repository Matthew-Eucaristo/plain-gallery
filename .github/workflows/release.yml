name: Release

# Push a tag like v0.2.0 (matching versionName in app/build.gradle.kts) to publish a signed APK.
# Needs repository secrets: PLAINGALLERY_KEYSTORE_BASE64, PLAINGALLERY_KEYSTORE_PASSWORD,
# PLAINGALLERY_KEY_ALIAS, PLAINGALLERY_KEY_PASSWORD (see docs/RELEASING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != versionName $version"; exit 1; }

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAINGALLERY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Signing secrets are not configured; skipping the automated release (publish manually, see docs/RELEASING.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "PLAINGALLERY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build signed APK and bundle
        if: steps.key.outputs.configured == 'true'
        env:
          PLAINGALLERY_KEYSTORE_PASSWORD: ${{ secrets.PLAINGALLERY_KEYSTORE_PASSWORD }}
          PLAINGALLERY_KEY_ALIAS: ${{ secrets.PLAINGALLERY_KEY_ALIAS }}
          PLAINGALLERY_KEY_PASSWORD: ${{ secrets.PLAINGALLERY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: App stays offline
        if: steps.key.outputs.configured == 'true'
        run: scripts/check-permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Collect files
        if: steps.key.outputs.configured == 'true'
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/plain-gallery-$GITHUB_REF_NAME.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: softprops/action-gh-release@v3
        if: steps.key.outputs.configured == 'true'
        with:
          files: dist/*
          generate_release_notes: true

      - name: Keep the bundle for Google Play
        if: steps.key.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
